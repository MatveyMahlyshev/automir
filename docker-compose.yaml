services:
  db:
    image: postgres:16
    container_name: auto_db
    restart: always
    environment:
      POSTGRES_USER: automir
      POSTGRES_PASSWORD: automir
      POSTGRES_DB: automir_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - next_build:/app/.next  # ← добавь это
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: poetry run uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
    depends_on:
      - db


volumes:
  postgres_data:
  next_build:  