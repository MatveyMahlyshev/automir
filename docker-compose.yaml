services:
  db:
    image: postgres:16
    container_name: auto_db
    restart: always
    environment:
      POSTGRES_USER: automir
      POSTGRES_PASSWORD: automir
      POSTGRES_DB: automir_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: