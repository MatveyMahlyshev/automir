services:
  db:
    image: postgres:16
    container_name: automir_database
    restart: always
    environment:
      POSTGRES_USER: automir
      POSTGRES_PASSWORD: automir
      POSTGRES_DB: automir_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    container_name: automir_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - next_build:/app/.next  
  
  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    container_name: automir_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/backend:Z


volumes:
  postgres_data:
  next_build: